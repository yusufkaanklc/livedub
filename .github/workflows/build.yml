# Builds LiveDub for Windows and macOS (Apple Silicon) on every "v*" tag or by hand
# (Actions tab -> build -> Run workflow). Download the zips from the run's Artifacts.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements-build.txt

      - name: Offline engine tests
        run: python tests/mock_engines.py

      - name: Build
        run: pyinstaller livedub.spec --noconfirm

      # The frozen app must at least start and enumerate audio devices.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          $p = Start-Process -FilePath dist\LiveDub\LiveDub.exe -ArgumentList "--list-devices" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "LiveDub.exe exited with $($p.ExitCode)" }

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./dist/LiveDub.app/Contents/MacOS/LiveDub --list-devices

      # The microphone-permission probe calls the Objective-C runtime through ctypes;
      # make sure it returns a real status inside the frozen app.
      - name: Diagnose (macOS)
        if: runner.os == 'macOS'
        run: |
          out=$(./dist/LiveDub.app/Contents/MacOS/LiveDub --diagnose)
          echo "$out"
          echo "$out" | grep -E "Mikrofon izni: (authorized|denied|restricted|not_determined)"

      # Users' Macs have no CA file where the frozen Python looks for one; hide the runner's
      # CA roots the same way and make sure TLS to the APIs still works (via certifi).
      - name: TLS check without system CA roots (macOS)
        if: runner.os == 'macOS'
        env:
          SSL_CERT_FILE: /nonexistent/cert.pem
          SSL_CERT_DIR: /nonexistent
        run: |
          python -c "import ssl; print('system CA roots visible:', ssl.create_default_context().cert_store_stats()['x509_ca'])"
          ./dist/LiveDub.app/Contents/MacOS/LiveDub --check-connection

      - name: TLS check (Windows)
        if: runner.os == 'Windows'
        run: |
          $p = Start-Process -FilePath dist\LiveDub\LiveDub.exe -ArgumentList "--check-connection" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "connection check failed" }

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/LiveDub -DestinationPath LiveDub-Windows.zip

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/LiveDub.app LiveDub-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LiveDub-${{ runner.os }}
          path: LiveDub-*.zip
